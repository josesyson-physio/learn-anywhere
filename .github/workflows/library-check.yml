# Fails any pull request that puts code (not just study content) into library/.
name: Library is plain data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npm install --no-save --ignore-scripts acorn@8.14.0
      - run: node tools/check_library.mjs
